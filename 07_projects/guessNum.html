<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess a Number</title>
    <style>
      body {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="" title="Trigger to home">Home</a>
      <a target="_blank" href="" title="Youtube">Youtube channel</a>
    </nav>

    <div id="wrapper">
      <h1>Number gussing Game</h1>
      <p>Try and guess a number between 1 to 100.</p>
      <p>You have 10 attempts to guess a right number.</p>
      <br />
      <form class="form">
        <label for="guessField" id="guess">Guess a number :</label>
        <input type="text" id="guessField" class="guessField" />
        <input
          type="submit"
          id="subt"
          value="Submit guess"
          class="guessField"
        />
      </form>
      <div class="resultParas">
        <p>Previous Guesses : <span class="guesses"></span></p>
        <p>Guesses Remaining : <span class="lastResult">10</span></p>
        <p class="lowOrHi"></p>
      </div>
    </div>
    <script src="guessNum.js"></script>
  </body>
</html>
